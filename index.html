  <!-- Hors ligne : service worker (voir sw.js) -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol !== 'https:' && !local) return;
      function banner(text, label, action) {
        var old = document.querySelector('.sw-banner');
        if (old) old.remove();
        var el = document.createElement('div');
        el.className = 'sw-banner';
        el.setAttribute('role', 'status');
        el.innerHTML = '<span></span>' + (label ? '<button type="button"></button>' : '');
        el.querySelector('span').textContent = text;
        if (label) { var b = el.querySelector('button'); b.textContent = label; b.onclick = action; }
        document.body.appendChild(el);
        requestAnimationFrame(function () { el.classList.add('is-in'); });
        if (!label) setTimeout(function () { el.classList.remove('is-in'); setTimeout(function () { el.remove(); }, 400); }, 3500);
      }
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController) banner('Nouvelle version de l’appli installée.', 'Recharger', function () { location.reload(); });
        else banner('L’appli est prête à fonctionner hors ligne.');
        hadController = true;
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          /* Retour sur l'appli (téléphone) : on vérifie s'il existe une nouvelle version */
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && navigator.onLine) reg.update().catch(function () {});
          });
        }).catch(function () {});
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      });
    })();
  </script>
